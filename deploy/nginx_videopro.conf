# VIDEOPRO STUDIO v2.0 (FastAPI Hybrid Video Engine en 127.0.0.1:7895)
location = /pro/videopro { return 301 /pro/videopro/; }
location /pro/videopro/ {
    proxy_pass http://127.0.0.1:7895/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    client_max_body_size 500M;
}

# VIDEOPRO STREAMLIT MPT WEBUI (Legacy MoneyPrinterTurbo en 127.0.0.1:8501)
location = /pro/videopro-mpt { return 301 /pro/videopro-mpt/; }
location /pro/videopro-mpt/ {
    proxy_pass http://127.0.0.1:8501/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}
