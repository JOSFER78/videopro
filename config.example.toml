azure_api_key = ""
minimax_api_key = ""
fal_api_key = ""
siliconflow_api_key = ""
fish_audio_api_key = ""
elevenlabs_api_key = ""
replicate_api_token = ""
flowmusic_session = ""
openrouter_api_key = ""
pexels_api_key = ""
pixabay_api_key = ""
together_api_key = ""
cerebras_api_key = ""
anthropic_api_key = ""
suno_api_key = ""
whisper_provider = "Groq Whisper Cloud"
subtitle_max_words = 2
subtitle_style = "Vox Highlight (Amarillo Dinámico)"
default_resolution = "1080x1920 (9:16 Vertical)"
default_fps = 24
ffmpeg_threads = 4
s3_endpoint = ""
s3_access_key = ""
s3_bucket = "videopro-masters"
