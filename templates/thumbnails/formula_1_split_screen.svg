<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,700;1,700&amp;family=JetBrains+Mono:wght@700;800&amp;family=Montserrat:wght@900&amp;display=swap');
      .title-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 76px; fill: #FFFFFF; stroke: #000000; stroke-width: 14px; stroke-linejoin: round; paint-order: stroke fill; letter-spacing: -2px; }
      .title-highlight { fill: #FFEA00; }
      .badge-text { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 26px; fill: #FFFFFF; letter-spacing: 2px; }
      .hud-text { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 16px; fill: #00F2FE; letter-spacing: 1.5px; }
      .hud-amber { fill: #FFA726; }
      .hud-magenta { fill: #FF007A; }
      .hud-bg { fill: rgba(6, 8, 13, 0.85); stroke: #00F2FE; stroke-width: 1.5px; }
      .hud-bg-amber { fill: rgba(6, 8, 13, 0.85); stroke: #FFA726; stroke-width: 1.5px; }
    </style>
    
    <!-- Gradients for 3 Epochs -->
    <linearGradient id="past-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2505"/>
      <stop offset="40%" stop-color="#9E5D1E"/>
      <stop offset="80%" stop-color="#DDA15E"/>
      <stop offset="100%" stop-color="#FEFAE0"/>
    </linearGradient>
    
    <linearGradient id="present-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="future-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03071E"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="75%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Laser energy beams -->
    <linearGradient id="laser-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="laser-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF007A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FF007A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="shadow-heavy">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- BACKGROUND: 3 COLUMNS SPLIT -->
  <!-- Left: Past (-280 BC) -->
  <g id="past-section">
    <rect x="0" y="0" width="426" height="720" fill="url(#past-grad)"/>
    <!-- Silhouette of Ancient Lighthouse / Colossus -->
    <path d="M 120 720 L 160 380 L 190 380 L 190 260 L 230 260 L 230 380 L 260 380 L 300 720 Z" fill="#2E1805" opacity="0.85"/>
    <circle cx="210" cy="220" r="30" fill="#FFE57F" filter="url(#glow-cyan)" opacity="0.9"/>
    <!-- Sun rays -->
    <polygon points="210,220 0,0 150,0" fill="#FFFDF0" opacity="0.15"/>
    <polygon points="210,220 0,180 0,320" fill="#FFFDF0" opacity="0.15"/>
    <polygon points="210,220 0,450 100,720" fill="#FFFDF0" opacity="0.12"/>
    <!-- Ground / Waves -->
    <path d="M 0 540 Q 150 510 300 550 T 426 530 L 426 720 L 0 720 Z" fill="#1C0F03" opacity="0.9"/>
  </g>

  <!-- Middle: Present (2026 AD) -->
  <g id="present-section">
    <rect x="426" y="0" width="428" height="720" fill="url(#present-grad)"/>
    <!-- Modern Ruins / Concrete blocks -->
    <path d="M 480 720 L 520 480 L 600 510 L 620 460 L 710 490 L 760 720 Z" fill="#0B131F" opacity="0.95"/>
    <line x1="426" y1="530" x2="854" y2="530" stroke="#475569" stroke-width="3" stroke-dasharray="10 6"/>
    <!-- Modern skyline in fog -->
    <rect x="540" y="320" width="40" height="180" fill="#1E293B" opacity="0.6"/>
    <rect x="600" y="280" width="55" height="220" fill="#1E293B" opacity="0.6"/>
    <rect x="680" y="340" width="45" height="160" fill="#1E293B" opacity="0.6"/>
  </g>

  <!-- Right: Future (+2450 AD) -->
  <g id="future-section">
    <rect x="854" y="0" width="426" height="720" fill="url(#future-grad)"/>
    <!-- Cyber Spire 4000m -->
    <path d="M 940 720 L 1020 180 L 1040 60 L 1050 60 L 1070 180 L 1150 720 Z" fill="#030B17"/>
    <!-- Glowing blue conduits -->
    <line x1="1045" y1="60" x2="1045" y2="720" stroke="#00F2FE" stroke-width="4" filter="url(#glow-cyan)"/>
    <line x1="990" y1="360" x2="1100" y2="360" stroke="#00F2FE" stroke-width="2" filter="url(#glow-cyan)"/>
    <line x1="970" y1="480" x2="1120" y2="480" stroke="#00F2FE" stroke-width="2" filter="url(#glow-cyan)"/>
    <!-- Sky rings / Transports -->
    <ellipse cx="1045" cy="240" rx="90" ry="16" fill="none" stroke="#00F2FE" stroke-width="3" opacity="0.8"/>
    <ellipse cx="1045" cy="400" rx="140" ry="24" fill="none" stroke="#FF007A" stroke-width="3" opacity="0.7"/>
    <!-- Flying vehicles (light streaks) -->
    <line x1="880" y1="420" x2="960" y2="400" stroke="#FFA726" stroke-width="3" filter="url(#glow-cyan)"/>
    <line x1="1140" y1="310" x2="1240" y2="330" stroke="#00F2FE" stroke-width="3" filter="url(#glow-cyan)"/>
  </g>

  <!-- 3D REALITY SPLIT LASERS -->
  <!-- Laser Beam 1 (Past / Present) -->
  <rect x="418" y="0" width="16" height="720" fill="url(#laser-cyan)" filter="url(#glow-cyan)"/>
  <line x1="426" y1="0" x2="426" y2="720" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Energy Nodes -->
  <circle cx="426" cy="180" r="8" fill="#FFFFFF" filter="url(#glow-cyan)"/>
  <circle cx="426" cy="530" r="10" fill="#00F2FE" filter="url(#glow-cyan)"/>

  <!-- Laser Beam 2 (Present / Future) -->
  <rect x="846" y="0" width="16" height="720" fill="url(#laser-magenta)" filter="url(#glow-cyan)"/>
  <line x1="854" y1="0" x2="854" y2="720" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="854" cy="240" r="8" fill="#FFFFFF" filter="url(#glow-cyan)"/>
  <circle cx="854" cy="530" r="10" fill="#FF007A" filter="url(#glow-cyan)"/>

  <!-- TOP VIGNETTE OVERLAY FOR TEXT CONTRAST -->
  <rect x="0" y="0" width="1280" height="240" fill="black" opacity="0.45"/>

  <!-- EPOCH BADGES -->
  <!-- Left Badge -->
  <g transform="translate(40, 40)">
    <rect width="180" height="38" rx="6" class="hud-bg-amber"/>
    <text x="90" y="26" text-anchor="middle" class="badge-text" fill="#FFA726">280 A.C.</text>
  </g>

  <!-- Middle Badge -->
  <g transform="translate(550, 40)">
    <rect width="180" height="38" rx="6" class="hud-bg"/>
    <text x="90" y="26" text-anchor="middle" class="badge-text" fill="#94A3B8">2026 D.C.</text>
  </g>

  <!-- Right Badge -->
  <g transform="translate(1040, 40)">
    <rect width="200" height="38" rx="6" class="hud-bg"/>
    <text x="100" y="26" text-anchor="middle" class="badge-text" fill="#00F2FE">+2450 D.C.</text>
  </g>

  <!-- MASTER COPY / HOOK TEXT (< 4 WORDS, MAX CONTRAST) -->
  <g transform="translate(60, 190)" filter="url(#shadow-heavy)">
    <text x="0" y="0" class="title-text">
      3,000 AÑOS <tspan class="title-highlight">DESPUÉS</tspan>
    </text>
  </g>

  <!-- HUD TELEMETRY FOOTER & GPS -->
  <g transform="translate(40, 660)">
    <rect width="360" height="34" rx="4" fill="rgba(6, 8, 13, 0.9)" stroke="#FFA726" stroke-width="1"/>
    <text x="15" y="23" class="hud-text hud-amber">GEO_LOCK: 31.2001° N, 29.9187° E</text>
  </g>

  <g transform="translate(460, 660)">
    <rect width="360" height="34" rx="4" fill="rgba(6, 8, 13, 0.9)" stroke="#00F2FE" stroke-width="1"/>
    <text x="15" y="23" class="hud-text">CHRONO-DRIFT // VECTOR T-01</text>
  </g>
</svg>
