<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Chakra+Petch:wght@700;800&amp;family=JetBrains+Mono:wght@700;800&amp;display=swap');
      .title-bebas { font-family: 'Bebas Neue', sans-serif; font-size: 100px; fill: #FFFFFF; stroke: #000000; stroke-width: 14px; stroke-linejoin: round; paint-order: stroke fill; letter-spacing: 2px; }
      .title-gold { fill: #FFD700; }
      .hud-title { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; fill: #00F2FE; letter-spacing: 1.5px; }
      .hud-mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; fill: #00F2FE; letter-spacing: 1px; }
      .hud-amber { fill: #FFA726; }
      .hud-emerald { fill: #00E676; }
    </style>

    <!-- Background: Left Desert Sun / Right Twilight Glow -->
    <linearGradient id="bg-ruins-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="50%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="bg-holo-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- LiDAR Laser vertical divider -->
    <linearGradient id="lidar-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-lidar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="drop-heavy">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- LEFT HALF: WEATHERED DESERT RUINS (ANCIENT REALITY TODAY) -->
  <g id="left-ruins">
    <rect x="0" y="0" width="640" height="720" fill="url(#bg-ruins-sky)"/>
    <!-- Sun disk -->
    <circle cx="280" cy="180" r="100" fill="#FDE68A" opacity="0.4"/>
    
    <!-- Broken Columns & Eroded Temple Pediment -->
    <path d="M 60 720 L 100 420 L 140 420 L 140 720 Z" fill="#291403"/>
    <path d="M 170 720 L 200 480 L 230 480 L 240 720 Z" fill="#3D1D05"/>
    <!-- Broken Arch / Crumbling blocks -->
    <path d="M 280 720 L 320 380 L 440 380 L 460 720 Z" fill="#1C0D02"/>
    <polygon points="310,380 450,380 380,310" fill="#291403"/>
    <circle cx="480" cy="520" r="25" fill="#3D1D05"/>
    <!-- Sand dunes covering base -->
    <path d="M 0 560 Q 200 500 400 570 T 640 540 L 640 720 L 0 720 Z" fill="#180A01"/>
  </g>

  <!-- RIGHT HALF: 3D HOLOGRAPHIC & GOLDEN RESTORATION -->
  <g id="right-restoration">
    <rect x="640" y="0" width="640" height="720" fill="url(#bg-holo-sky)"/>
    <!-- Intact Glorious Temple (Babylon/Alexandria) -->
    <!-- Colonnade in perspective -->
    <path d="M 640 540 L 640 380 L 880 260 L 1180 340 L 1180 720 Z" fill="#021E17" opacity="0.9"/>
    
    <!-- Intact Columns with Gold Inlay & Azure Blue Bricks -->
    <rect x="700" y="360" width="30" height="260" fill="#0D9488"/>
    <rect x="760" y="340" width="30" height="280" fill="#0D9488"/>
    <rect x="820" y="320" width="30" height="300" fill="#0D9488"/>
    <rect x="880" y="300" width="30" height="320" fill="#0D9488"/>
    <rect x="940" y="320" width="30" height="300" fill="#0D9488"/>
    <rect x="1000" y="340" width="30" height="280" fill="#0D9488"/>

    <!-- Gold Capitals & Pediment -->
    <polygon points="680,360 880,250 1080,360" fill="#F59E0B"/>
    <polygon points="720,350 880,270 1040,350" fill="#FDE68A" filter="url(#glow-lidar)"/>

    <!-- Lush Cascading Gardens & Waterfalls -->
    <path d="M 680 460 Q 720 500 760 460 Q 800 510 840 470 Q 880 520 940 480" stroke="#10B981" stroke-width="12" fill="none"/>
    <path d="M 720 520 Q 780 560 840 520 Q 900 570 960 530" stroke="#10B981" stroke-width="16" fill="none"/>
    <!-- Waterfalls -->
    <line x1="750" y1="470" x2="750" y2="600" stroke="#67E8F9" stroke-width="6" opacity="0.8" filter="url(#glow-lidar)"/>
    <line x1="860" y1="480" x2="860" y2="620" stroke="#67E8F9" stroke-width="8" opacity="0.8" filter="url(#glow-lidar)"/>

    <!-- 3D LiDAR Wireframe Mesh overlay on right -->
    <g stroke="#00F2FE" stroke-width="1" opacity="0.4" fill="none">
      <line x1="640" y1="380" x2="1280" y2="380"/>
      <line x1="640" y1="450" x2="1280" y2="450"/>
      <line x1="640" y1="520" x2="1280" y2="520"/>
      <line x1="700" y1="200" x2="700" y2="720"/>
      <line x1="800" y1="200" x2="800" y2="720"/>
      <line x1="900" y1="200" x2="900" y2="720"/>
      <line x1="1000" y1="200" x2="1000" y2="720"/>
      <line x1="1100" y1="200" x2="1100" y2="720"/>
    </g>
  </g>

  <!-- MATCH-CUT CENTRAL SCANNING LASER -->
  <rect x="632" y="0" width="16" height="720" fill="url(#lidar-beam)" filter="url(#glow-lidar)"/>
  <line x1="640" y1="0" x2="640" y2="720" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Scanning beam rings & nodes -->
  <circle cx="640" cy="220" r="10" fill="#00E676" filter="url(#glow-lidar)"/>
  <circle cx="640" cy="480" r="14" fill="#00F2FE" filter="url(#glow-lidar)"/>
  <circle cx="640" cy="480" r="28" fill="none" stroke="#00F2FE" stroke-width="2" stroke-dasharray="6 4" filter="url(#glow-lidar)"/>

  <!-- TINY EXPLORER SILHOUETTE IN FOREGROUND FOR 1:100 SCALE MEGALITHIC PERSPECTIVE -->
  <g transform="translate(180, 580)">
    <!-- Person silhouette -->
    <ellipse cx="20" cy="10" rx="6" ry="8" fill="#000000"/>
    <path d="M 12 18 L 28 18 L 26 50 L 22 80 L 18 80 L 14 50 Z" fill="#000000"/>
    <!-- Flashlight Beam striking the ruins/laser -->
    <polygon points="26,30 460,-100 460,-40" fill="#FEF08A" opacity="0.35"/>
    <line x1="26" y1="30" x2="460" y2="-70" stroke="#FEF08A" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- TOP VIGNETTE FOR TEXT -->
  <rect x="0" y="0" width="1280" height="230" fill="black" opacity="0.5"/>

  <!-- HUD BADGES -->
  <!-- Top Left: Subtitle Pill -->
  <g transform="translate(50, 40)">
    <rect width="240" height="38" rx="6" fill="rgba(6, 8, 13, 0.85)" stroke="#FFA726" stroke-width="1.5"/>
    <text x="120" y="26" text-anchor="middle" class="hud-title hud-amber">BABILONIA 1250 A.C.</text>
  </g>

  <!-- Top Right: LiDAR Scan HUD -->
  <g transform="translate(940, 40)" filter="url(#glow-lidar)">
    <rect width="290" height="38" rx="6" fill="rgba(6, 8, 13, 0.85)" stroke="#00E676" stroke-width="1.5"/>
    <text x="145" y="26" text-anchor="middle" class="hud-title hud-emerald">⚡ 3D LiDAR RESTORE: 99.8%</text>
  </g>

  <!-- MASTER COPY / HOOK TEXT (< 4 WORDS) -->
  <g transform="translate(50, 180)" filter="url(#drop-heavy)">
    <text x="0" y="0" class="title-bebas">
      ASÍ ERA <tspan class="title-gold">REALMENTE</tspan>
    </text>
  </g>

  <!-- BOTTOM TELEMETRY -->
  <g transform="translate(50, 650)">
    <rect width="380" height="34" rx="4" fill="rgba(6, 8, 13, 0.9)" stroke="#00F2FE" stroke-width="1"/>
    <text x="15" y="23" class="hud-mono">GEO: MESOPOTAMIA // EPOCH -1250</text>
  </g>
</svg>
