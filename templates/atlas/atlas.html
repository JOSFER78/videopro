<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plantilla Atlas</title>
<style>
  @font-face { font-family: "Serif"; src: url("fonts/instrument-serif-latin-400-normal.woff2"); }
  @font-face { font-family: "Serif"; font-style: italic; src: url("fonts/instrument-serif-latin-400-italic.woff2"); }
  @font-face { font-family: "Sans"; font-weight: 400; src: url("fonts/inter-latin-400-normal.woff2"); }
  @font-face { font-family: "Sans"; font-weight: 500; src: url("fonts/inter-latin-500-normal.woff2"); }
  @font-face { font-family: "Sans"; font-weight: 600; src: url("fonts/inter-latin-600-normal.woff2"); }
  :root { --bg: #0c0d0f; --card: #141619; --line: rgba(255,255,255,.16); --ink: #f3f1ec; --dim: #8e9096; --faint: #4c4e53; --hot: #ff4b33; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; color: var(--ink);
               font-family: "Sans", Arial, sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; }
  /* Fondo: opaco salvo el hueco del escenario cuando lo que toca es un vídeo (lo coloca FFmpeg debajo) */
  #bg { position: absolute; inset: 0; background: var(--bg); }
  .caps { text-transform: uppercase; letter-spacing: .16em; font-weight: 600; }
  .serif { font-family: "Serif", Georgia, serif; font-weight: 400; }
  [data-fit] { white-space: nowrap; overflow: hidden; }

  /*
   * ZONAS FIJAS
   *   y  36–118   ÍNDICE: serie y temporada a la izquierda; los episodios en fila, el actual abierto con sus partes
   *   y 150–850   ESCENARIO (imagen real de lo que se cuenta) + carril derecho estrecho: minimapa y dato
   *   y 884–1046  EJE CRONOLÓGICO con la aguja de "estamos aquí" y el avance del episodio
   */

  /* ÍNDICE */
  #brand { position: absolute; left: 64px; top: 40px; width: 430px; }
  #brand .series { font-size: 19px; color: var(--ink); }
  #brand .season { font-size: 31px; line-height: 38px; color: var(--dim); font-style: italic; margin-top: 6px; }
  #steps { position: absolute; left: 520px; right: 64px; top: 40px; height: 80px; display: flex; gap: 10px; }
  .step { flex: 1; min-width: 0; border-top: 2px solid var(--faint); padding-top: 9px; color: var(--faint); }
  .step .n { font-size: 19px; font-weight: 600; letter-spacing: .06em; }
  .step.done { border-color: var(--ink); color: var(--ink); }
  .step.now { flex: 5.4; border-color: var(--hot); color: var(--ink); display: flex; gap: 16px; align-items: baseline; position: relative; }
  .step.now .n { color: var(--hot); }
  .step.now .t { font-family: "Serif", serif; font-size: 34px; line-height: 36px; flex: 1; min-width: 0; }
  .step .t, .step .parts { display: none; }
  .step.now .t { display: block; }
  .step.now .parts { display: flex; }
  .parts { position: absolute; left: 0; right: 0; top: 56px; gap: 6px; }
  .part { flex: 1; min-width: 0; }
  .part .bar { height: 3px; background: var(--faint); position: relative; }
  .part .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
  .part.now .bar i { background: var(--hot); }
  .part .lbl { font-size: 15px; margin-top: 6px; color: var(--faint); }
  .part.done .lbl { color: var(--dim); }
  .part.now .lbl { color: var(--ink); }

  /* ESCENARIO */
  #stage { position: absolute; left: 64px; top: 150px; width: 1444px; height: 700px; overflow: hidden; background: #000; }
  #stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #stage .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(8,9,10,.92) 0, rgba(8,9,10,.45) 26%, rgba(8,9,10,0) 52%); }
  #lower { position: absolute; left: 44px; right: 44px; bottom: 38px; }
  #lower .k { font-size: 18px; color: var(--hot); }
  #lower .h { font-size: 78px; line-height: 84px; margin-top: 6px; }
  #lower .s { font-size: 27px; line-height: 34px; color: #d6d4cf; margin-top: 4px; }
  #credit { position: absolute; right: 18px; top: 14px; font-size: 14px; color: rgba(255,255,255,.72); background: rgba(0,0,0,.45); padding: 4px 9px; }

  /* CARRIL DERECHO */
  .card { position: absolute; left: 1532px; width: 324px; background: var(--card); border: 1px solid var(--line); }
  .card .k { font-size: 14px; color: var(--dim); }
  #map { top: 150px; height: 392px; padding: 16px 18px; }
  #map svg { display: block; width: 288px; height: 268px; margin-top: 10px; }
  #map .place { font-size: 31px; line-height: 34px; margin-top: 10px; }
  #map .where { font-size: 16px; color: var(--dim); margin-top: 2px; }
  #datum { top: 558px; height: 292px; padding: 16px 18px; overflow: hidden; }
  #datum .v { font-size: 82px; line-height: 84px; margin-top: 14px; }
  #datum .u { font-size: 20px; color: var(--dim); margin-top: 2px; }
  #datum .cmp { position: absolute; left: 18px; right: 18px; bottom: 16px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 17px; line-height: 23px; color: var(--dim); }
  #datum .cmp b { color: var(--ink); font-weight: 500; }

  /* APRENDIDO: entra, se queda unos segundos y sale */
  #learned { position: absolute; left: 1532px; width: 324px; top: 558px; height: 292px; background: var(--ink); color: #111; padding: 18px 20px; }
  #learned .k { font-size: 14px; color: #6b6d72; }
  #learned .n { font-size: 15px; font-weight: 600; margin-top: 4px; }
  #learned .t { font-size: 37px; line-height: 40px; margin-top: 14px; }

  /* EJE CRONOLÓGICO */
  #axisTitle { position: absolute; left: 64px; top: 884px; font-size: 14px; color: var(--dim); }
  #axisNote { position: absolute; right: 64px; top: 884px; font-size: 14px; color: var(--faint); }
  #axis { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
  .tl { position: absolute; top: 992px; width: 130px; margin-left: -65px; text-align: center; font-size: 17px; color: var(--dim); }
  .ep { position: absolute; top: 922px; width: 30px; margin-left: -15px; text-align: center; font-size: 14px; font-weight: 600; color: var(--faint); }
  .ep.done { color: var(--ink); }
  #needleTag { position: absolute; top: 912px; height: 30px; line-height: 31px; padding: 0 12px; background: var(--hot); color: #fff; font-size: 15px; white-space: nowrap; }
  #progress { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--hot); }

  /* PAUSA Y PIENSA */
  #ask { position: absolute; left: 64px; top: 150px; width: 1444px; height: 700px; display: flex; align-items: center; justify-content: center; background: rgba(8,9,10,.62); }
  #ask .box { text-align: center; max-width: 1100px; }
  #ask .k { font-size: 18px; color: var(--hot); }
  #ask .t { font-size: 84px; line-height: 90px; margin-top: 14px; }

  /* ÍNDICE COMPLETO (repaso): la tabla de contenidos de la temporada */
  #index { position: absolute; left: 64px; top: 150px; width: 1792px; height: 700px; background: var(--bg); border-top: 1px solid var(--line); padding-top: 26px; }
  #index .k { font-size: 16px; color: var(--hot); }
  #index .take { font-size: 62px; line-height: 68px; margin-top: 10px; max-width: 1500px; }
  #rows { position: absolute; left: 0; right: 0; bottom: 0; height: 392px; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-auto-rows: 1fr; column-gap: 44px; }
  .row { display: flex; align-items: baseline; gap: 18px; border-top: 1px solid var(--line); padding-top: 16px; color: var(--dim); min-width: 0; }
  .row .n { font-size: 17px; font-weight: 600; letter-spacing: .06em; width: 30px; }
  .row .c { flex: 1; min-width: 0; }
  .row .t { font-family: "Serif", serif; font-size: 35px; line-height: 38px; }
  .row .i { font-size: 17px; line-height: 23px; margin-top: 5px; color: var(--dim); }
  .row:not(.done) .i { visibility: hidden; }
  .row .w { font-size: 15px; white-space: nowrap; }
  .row.done { color: var(--ink); }
  .row.done .n { color: var(--hot); }
  .row.next .t { color: var(--ink); }
  .row .tag { font-size: 12px; font-weight: 600; letter-spacing: .14em; padding: 3px 8px; margin-left: 6px; }
  .row.done .tag { background: var(--ink); color: #111; }
  .row .tag.nx { border: 1px solid var(--hot); color: var(--hot); background: none; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="brand"><div class="series caps" data-fit></div><div class="season serif" data-fit></div></div>
<div id="steps"></div>

<div id="stage">
  <img id="imgA"><img id="imgB">
  <div class="shade"></div>
  <div id="credit"></div>
  <div id="lower"><div class="k caps" data-fit></div><div class="h serif" data-fit></div><div class="s" data-fit></div></div>
</div>
<div id="map" class="card"><div class="k caps">Dónde</div><svg viewBox="0 0 288 268"></svg><div class="place serif" data-fit></div><div class="where" data-fit></div></div>
<div id="datum" class="card"><div class="k caps" data-fit></div><div class="v serif" data-fit></div><div class="u" data-fit></div><div class="cmp"></div></div>
<div id="learned"><div class="k caps">Aprendido</div><div class="n"></div><div class="t serif"></div></div>
<div id="ask"><div class="box"><div class="k caps"></div><div class="t serif"></div></div></div>
<div id="index"><div class="k caps"></div><div class="take serif"></div><div id="rows"></div></div>

<div id="axisTitle" class="caps"></div><div id="axisNote"></div>
<svg id="axis"></svg><div id="tls"></div><div id="eps"></div><div id="needleTag" class="caps"></div>
<div id="progress"></div>

<script src="vendor/land110m.js"></script>
<script>
/*
 * Plantilla "Atlas": el vídeo como un libro con índice. Siempre se ve en qué temporada, episodio y
 * parte estamos, dónde ocurrió lo que se cuenta (minimapa) y cuándo (eje cronológico).
 * window.initHud(config) una vez y window.renderHud(t) por fotograma; todo es función pura de t.
 */
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const io = (t, at, hold, d = 0.45) => ease((t - at) / d) * (1 - ease((t - (at + hold - d)) / d));   // entra y sale
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const latest = (list, t) => [...(list || [])].reverse().find((x) => t >= x.at) || null;
const AX = { x0: 64, x1: 1856, y: 972 };
const STAGE = { x: 64, y: 150, w: 1444, h: 700 };
const isVideo = (v) => /\.(mp4|mov|webm|mkv)$/i.test(v.src);
window.STAGE = STAGE; window.isVideoSrc = (src) => isVideo({ src });
let C = null, proj = null, PANO = false, mapKey = "";

// Minimapa: proyección equirrectangular sobre el encuadre pedido. Cada lugar puede traer el suyo
// (place.bounds) y el mapa viaja de uno a otro; solo se redibuja cuando el encuadre cambia.
const frame = (b) => {
  const key = b.map((v) => v.toFixed(2)).join();
  if (key === mapKey) return; mapKey = key;
  const [lon0, lat0, lon1, lat1] = b;
  const k = Math.cos(((lat0 + lat1) / 2) * Math.PI / 180);
  const s = Math.min(288 / ((lon1 - lon0) * k), 268 / (lat1 - lat0));
  const ox = (288 - (lon1 - lon0) * k * s) / 2, oy = (268 - (lat1 - lat0) * s) / 2;
  proj = ([lon, lat]) => [ox + (lon - lon0) * k * s, oy + (lat1 - lat) * s];
  // los contornos que cruzan el antimeridiano se desenrollan para que no tracen una raya de lado a lado
  const unwrap = (ring) => { let off = 0; return ring.map((p, i) => { if (i) { const d = p[0] - ring[i - 1][0]; if (d > 180) off -= 360; else if (d < -180) off += 360; } return [p[0] + off, p[1]]; }); };
  $("#land").setAttribute("d", window.LAND_110M.map((ring) => { const u = unwrap(ring), wraps = u.some((p, i) => p[0] !== ring[i][0]);
    return (wraps ? [-360, 0, 360] : [0]).map((o) => "M" + u.map((p) => proj([p[0] + o, p[1]]).map((v) => v.toFixed(1)).join(",")).join("L") + "Z").join(""); }).join(""));
  document.querySelectorAll("#map .pl").forEach((g, i) => { const [x, y] = proj([C.map.places[i].lon, C.map.places[i].lat]);
    g.querySelectorAll("circle").forEach((c) => { c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); }); });
};

const timePos = (ya) => {
  const a = Math.log10(C.axis.from), b = Math.log10(C.axis.to);
  return clamp((a - Math.log10(Math.max(ya, C.axis.to))) / (a - b));
};
const axisX = (ya) => AX.x0 + timePos(ya) * (AX.x1 - AX.x0);
const posToYears = (p) => Math.pow(10, Math.log10(C.axis.from) - p * (Math.log10(C.axis.from) - Math.log10(C.axis.to)));
const fmtYears = (ya) => {
  if (ya <= C.axis.to * 1.05) return "Hoy";
  const r = ya >= 10000 ? Math.round(ya / 1000) * 1000 : ya >= 1000 ? Math.round(ya / 100) * 100 : ya >= 200 ? Math.round(ya / 10) * 10 : Math.round(ya / 5) * 5;
  return "Hace " + String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " años";
};

window.initHud = (config) => {
  C = config;
  if (C.accent) document.documentElement.style.setProperty("--hot", C.accent);
  $("#brand .series").textContent = C.series;
  $("#brand .season").textContent = C.season;

  // Índice superior: un tramo por episodio; el actual, abierto, con sus partes
  // En un episodio panorámico (episode: 0) cada parte dice a qué episodio de la temporada corresponde
  // (part.step) y el tramo abierto va avanzando; dentro se ven los pasos de esa parte (part.beats).
  PANO = !C.episode;
  const bars = (list) => `<div class="parts">${list.map((p) => `<div class="part"><div class="bar"><i></i></div><div class="lbl" data-fit>${esc(p.label)}</div></div>`).join("")}</div>`;
  $("#steps").innerHTML = C.episodes.map((e, i) => {
    const n = String(i + 1).padStart(2, "0"), cur = i + 1 === C.episode;
    const own = PANO ? C.parts.find((p) => p.step === i + 1) : null;
    return `<div class="step ${!PANO && i + 1 < C.episode ? "done" : ""} ${cur ? "now" : ""}"><span class="n">${n}</span><span class="t" data-fit>${esc(e.title)}</span>${
      cur ? bars(C.parts) : own?.beats ? bars(own.beats) : ""}</div>`;
  }).join("");

  // Minimapa: proyección equirrectangular sobre la región pedida
  $("#map svg").innerHTML = `<defs><clipPath id="mc"><rect width="288" height="268"/></clipPath></defs>
    <rect width="288" height="268" fill="#0f1113"/><g clip-path="url(#mc)"><path id="land" fill="#2b2e33" stroke="#3b3f45" stroke-width=".8"/>` +
    C.map.places.map((p, i) => `<g class="pl" data-i="${i}"><circle class="ring" r="6" fill="none" stroke="#ff4b33" stroke-width="1.6"/><circle class="dot" r="5.5" fill="#ff4b33" stroke="#0f1113" stroke-width="1.5"/></g>`).join("") + "</g>";
  mapKey = ""; frame(C.map.bounds);

  // Eje cronológico
  $("#axisTitle").textContent = C.axis.title; $("#axisNote").textContent = C.axis.note || "";
  $("#axis").innerHTML = `<line x1="${AX.x0}" y1="${AX.y}" x2="${AX.x1}" y2="${AX.y}" stroke="#4c4e53" stroke-width="2"/>` +
    C.axis.ticks.map((k) => `<line x1="${axisX(k.yearsAgo)}" y1="${AX.y}" x2="${axisX(k.yearsAgo)}" y2="${AX.y + 12}" stroke="#4c4e53" stroke-width="2"/>`).join("") +
    C.episodes.map((e) => `<circle class="epdot" cx="${axisX(e.yearsAgo)}" cy="${AX.y}" r="5" fill="#0c0d0f" stroke="#8e9096" stroke-width="2"/>`).join("") +
    `<line id="trail" x1="${AX.x1}" y1="${AX.y}" x2="${AX.x1}" y2="${AX.y}" stroke="#ff4b33" stroke-width="3"/>
     <line id="needle" y1="${AX.y - 30}" y2="${AX.y + 12}" stroke="#ff4b33" stroke-width="3"/>`;
  $("#tls").innerHTML = C.axis.ticks.map((k) => `<div class="tl" style="left:${axisX(k.yearsAgo)}px">${esc(k.label)}</div>`).join("");
  $("#eps").innerHTML = C.episodes.map((e, i) => `<div class="ep" style="left:${axisX(e.yearsAgo)}px">${String(i + 1).padStart(2, "0")}</div>`).join("");

  if (C.index) {
    $("#index .k").textContent = C.index.kicker; $("#index .take").textContent = C.index.takeaway;
    $("#rows").innerHTML = C.episodes.map((e, i) => {
      const st = PANO ? "" : i + 1 <= C.episode ? "done" : i === C.episode ? "next" : "";
      return `<div class="row ${st}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span class="c"><div class="t" data-fit>${esc(e.title)}</div>${
        e.idea ? `<div class="i" data-fit>${esc(e.idea)}</div>` : ""}</span><span class="w">${esc(e.when)}${
        st === "done" ? '<span class="tag">VISTO</span>' : st === "next" || (PANO && i === 0) ? '<span class="tag nx">SIGUIENTE</span>' : ""}</span></div>`;
    }).join("");
  }
};

window.renderHud = (t) => {
  const indexOn = C.index && t >= C.index.at;
  const indexK = C.index ? ease((t - C.index.at) / 0.6) : 0;

  // Partes del episodio en el índice superior
  const pi = Math.max(0, C.parts.findIndex((p, i) => t < (C.parts[i + 1]?.at ?? Infinity)));
  const partEnd = (i) => C.parts[i + 1]?.at ?? C.duration;
  const fill = (root, list, last) => root.querySelectorAll(".part").forEach((el, i) => {
    const start = list[i].at, end = list[i + 1]?.at ?? last;
    const cur = t >= start && t < end;
    el.classList.toggle("now", cur); el.classList.toggle("done", t >= end);
    el.querySelector("i").style.width = `${clamp((t - start) / (end - start)) * 100}%`;
  });
  if (!PANO) fill(document, C.parts, C.duration);
  else document.querySelectorAll(".step").forEach((el, i) => {
    // el tramo se abre al empezar su parte y se cierra al acabar, mientras se abre el siguiente
    const j = C.parts.findIndex((p) => p.step === i + 1);
    const open = j < 0 ? 0 : ease((t - C.parts[j].at) / 0.7) * (1 - ease((t - partEnd(j)) / 0.7));
    el.classList.toggle("now", open > 0); el.classList.toggle("done", j >= 0 && t >= partEnd(j) + 0.7);
    el.style.flexGrow = 1 + 4.4 * open;
    el.querySelector(".t").style.opacity = open; if (el.querySelector(".parts")) el.querySelector(".parts").style.opacity = open;
    if (j >= 0 && C.parts[j].beats) fill(el, C.parts[j].beats, partEnd(j));
  });

  // Imagen: fundido entre la anterior y la actual, con un acercamiento lento
  const vis = C.visuals, vi = Math.max(0, vis.findIndex((v, i) => t < (vis[i + 1]?.at ?? Infinity)));
  const paint = (img, v, fade) => {
    if (!v || (isVideo(v) && !v.frames)) { img.style.opacity = 0; return; }
    // un vídeo llega como carpeta de fotogramas (la prepara render.js): se elige el que toca en t
    const src = v.frames ? `${v.frames}/${String(Math.round(clamp((t - v.at) * v.fps + 1, 1, v.count))).padStart(5, "0")}.jpg` : v.src;
    if (img.dataset.src !== src) { img.src = src; img.dataset.src = src; }
    const end = vis[vis.indexOf(v) + 1]?.at ?? C.duration, z0 = v.zoom?.[0] ?? (v.frames ? 1 : 1.03), z1 = v.zoom?.[1] ?? (v.frames ? 1 : 1.12);
    const z = z0 + (z1 - z0) * clamp((t - v.at) / (end + 0.8 - v.at));
    img.style.objectPosition = `${v.focus?.[0] ?? 50}% ${v.focus?.[1] ?? 50}%`;
    img.style.transformOrigin = img.style.objectPosition;
    img.style.transform = `scale(${z})`; img.style.opacity = fade;
  };
  const fade = ease((t - vis[vi].at) / 0.8);
  paint($("#imgA"), vis[vi - 1] && fade < 1 ? vis[vi - 1] : null, 1);
  paint($("#imgB"), t >= vis[0].at ? vis[vi] : null, vi === 0 ? ease((t - vis[0].at) / 0.8) : fade);
  $("#credit").textContent = t >= vis[0].at ? vis[vi].credit : "";
  $("#credit").style.visibility = t >= vis[0].at && !indexOn ? "visible" : "hidden";

  // Rótulo de la parte, sobre la imagen
  const part = C.parts[pi], k = ease((t - part.at - 0.2) / 0.6);
  $("#lower .k").textContent = part.kicker || `Parte ${pi + 1} de ${C.parts.length}`;
  $("#lower .h").textContent = part.title; $("#lower .s").textContent = part.idea || "";
  $("#lower").style.opacity = k; $("#lower").style.transform = `translateY(${(1 - k) * 18}px)`;

  // Minimapa: los lugares aparecen cuando se nombran; el último es el actual
  // Un lugar puede caducar (until) para que no se quede en pantalla cuando ya se habla de otra cosa.
  const shown = C.map.places.filter((p) => t >= p.at && (p.until == null || t < p.until)), cur = shown[shown.length - 1];
  // Encuadre: map.views = [{at, bounds}] hace viajar el mapa de una región a otra
  const views = C.map.views || [], vn = views.filter((v) => t >= v.at).length;
  const b1 = views[vn - 1]?.bounds || C.map.bounds, b0 = views[vn - 2]?.bounds || C.map.bounds, mk = vn ? ease((t - views[vn - 1].at) / 1.6) : 1;
  frame(b1.map((v, i) => b0[i] + (v - b0[i]) * mk));
  document.querySelectorAll("#map .pl").forEach((g, i) => {
    const p = C.map.places[i], on = t >= p.at, ph = ((t - p.at) * 0.8) % 1;
    g.style.opacity = shown.includes(p) ? ease((t - p.at) / 0.4) : 0;
    const ring = g.querySelector(".ring");
    ring.setAttribute("r", p === cur ? 6 + ph * 16 : 6); ring.style.opacity = p === cur ? 1 - ph : 0;
  });
  $("#map .place").textContent = cur ? cur.name : ""; $("#map .where").textContent = cur ? cur.where : "";

  // Dato comparativo
  const d = latest(C.data, t);
  $("#datum").style.opacity = d ? ease((t - d.at) / 0.5) * (d.until == null ? 1 : 1 - ease((t - d.until) / 0.5)) : 0;
  if (d) {
    $("#datum .k").textContent = d.label; $("#datum .v").textContent = d.value; $("#datum .u").textContent = d.unit || "";
    $("#datum .cmp").innerHTML = d.compare || ""; $("#datum .cmp").style.display = d.compare ? "block" : "none";
  }

  // "Aprendido": entra por la derecha al cerrar cada parte y se va
  const l = (C.learned || []).find((x) => t >= x.at && t < x.at + x.hold), le = $("#learned");
  if (l && !indexOn) {
    const lk = io(t, l.at, l.hold);
    le.style.visibility = "visible"; le.style.transform = `translateX(${(1 - lk) * 420}px)`;
    le.querySelector(".n").textContent = `${(C.learned.indexOf(l) + 1)} de ${C.learned.length}`;
    le.querySelector(".t").textContent = l.text;
  } else le.style.visibility = "hidden";

  // Pausa y piensa
  const a = (C.asks || []).find((x) => t >= x.at && t < x.at + x.hold), ask = $("#ask");
  ask.style.visibility = a ? "visible" : "hidden";
  if (a) { ask.style.opacity = io(t, a.at, a.hold, 0.35); ask.querySelector(".k").textContent = a.kicker; ask.querySelector(".t").textContent = a.text; }

  // Eje: la aguja viaja hasta el momento del que se habla
  const stops = C.journey;
  let p = timePos(stops[0].yearsAgo);
  for (let i = 0; i < stops.length; i++) {
    if (t < stops[i].at) break;
    const next = stops[i + 1];
    if (!next) { p = timePos(stops[i].yearsAgo); break; }
    const travel = Math.min(next.travel || 1.5, next.at - stops[i].at);
    p = timePos(stops[i].yearsAgo) + (timePos(next.yearsAgo) - timePos(stops[i].yearsAgo)) * ease((t - (next.at - travel)) / travel);
  }
  const x = AX.x0 + p * (AX.x1 - AX.x0), ya = posToYears(p);
  $("#needle").setAttribute("x1", x); $("#needle").setAttribute("x2", x); $("#trail").setAttribute("x1", x);
  const tag = $("#needleTag"); tag.textContent = fmtYears(ya);
  tag.style.left = `${clamp(x - tag.offsetWidth / 2, AX.x0, AX.x1 - tag.offsetWidth)}px`;
  const seen = (i) => PANO ? C.parts.some((p) => p.step === i + 1 && t >= p.at) : i + 1 <= C.episode;
  document.querySelectorAll(".ep").forEach((el, i) => el.classList.toggle("done", seen(i)));
  document.querySelectorAll(".epdot").forEach((c, i) => { c.setAttribute("fill", seen(i) ? "#f3f1ec" : "#0c0d0f"); c.setAttribute("stroke", seen(i) ? "#f3f1ec" : "#8e9096"); });
  // la etiqueta del episodio que queda bajo la aguja se oculta para que no se pisen
  document.querySelectorAll(".ep").forEach((el, i) => {
    const ex = axisX(C.episodes[i].yearsAgo);
    el.style.visibility = Math.abs(ex - x) < tag.offsetWidth / 2 + 22 ? "hidden" : "visible";
  });
  $("#progress").style.width = `${clamp(t / C.duration) * 100}%`;

  // Índice completo
  const idx = $("#index");
  idx.style.visibility = indexOn ? "visible" : "hidden";
  if (indexOn) {
    idx.style.opacity = indexK;
    // el repaso puede ir cambiando de frase (index.takes) y encendiendo cada fila cuando se nombra (index.rows)
    const take = latest(C.index.takes, t); if (take) $("#index .take").textContent = take.text;
    if (C.index.rows) document.querySelectorAll(".row").forEach((r, i) => r.classList.toggle("done", t >= C.index.rows[i].at));
    const nx = $("#index .tag.nx"); if (nx && C.index.nextAt != null) nx.style.display = t >= C.index.nextAt ? "" : "none";
    document.querySelectorAll(".row").forEach((r, i) => { const rk = ease((t - C.index.at - 0.5 - i * 0.12) / 0.5); r.style.opacity = rk; r.style.transform = `translateY(${(1 - rk) * 14}px)`; });
  }
  for (const s of ["#stage", "#map", "#datum"]) $(s).style.visibility = indexOn && indexK >= 1 ? "hidden" : "visible";
};

/* Comprobación en el instante actual: textos que no caben en su caja y etiquetas del eje que se pisan. */
window.checkLayout = () => {
  const problems = [];
  const vis = (el) => { for (let e = el; e && e !== document.body; e = e.parentElement) { const cs = getComputedStyle(e); if (cs.visibility === "hidden" || cs.display === "none" || cs.opacity < 0.98) return false; } return el.offsetWidth > 0; };
  for (const el of document.querySelectorAll("[data-fit]"))
    if (vis(el) && el.scrollWidth > el.clientWidth + 1) problems.push(`no cabe: "${el.textContent.slice(0, 40)}"`);
  for (const sel of ["#learned .t", "#index .take", "#ask .t"]) {
    const el = $(sel); if (!vis(el)) continue;
    const box = el.closest("#learned, #index, #ask").getBoundingClientRect(), r = el.getBoundingClientRect();
    const limit = sel === "#index .take" ? $("#rows").getBoundingClientRect().top - 10 : box.bottom - 10;
    if (r.bottom > limit) problems.push(`no cabe en alto: "${el.textContent.slice(0, 40)}"`);
  }
  const tls = [...document.querySelectorAll(".tl")].map((e) => e.getBoundingClientRect());
  for (let i = 1; i < tls.length; i++) {
    const a = document.querySelectorAll(".tl")[i - 1], b = document.querySelectorAll(".tl")[i];
    const ra = document.createRange(); ra.selectNodeContents(a); const rb = document.createRange(); rb.selectNodeContents(b);
    if (ra.getBoundingClientRect().right > rb.getBoundingClientRect().left - 6) problems.push(`se pisan en el eje: ${a.textContent} y ${b.textContent}`);
  }
  return problems;
};
</script>
