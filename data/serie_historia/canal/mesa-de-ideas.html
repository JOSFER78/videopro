<title>Mesa de ideas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column. A few fully written proposals; under each, cold / warm / hot and one text box. Nothing else. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1b2422; --muted:#5d6966; --line:#d5dad6; --soft:#e9eeeb;
  --cold:#2f6fb0; --warm:#b07a12; --hot:#c2402f; --on:#ffffff; --accent:#0f6b5c;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2422; --ink:#e9eeeb; --muted:#9aa7a3; --line:#33403c; --soft:#26302d;
  --cold:#6aa8e6; --warm:#e6b34a; --hot:#ff8a78; --on:#10161a; --accent:#4fc3ad; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2422; --ink:#e9eeeb; --muted:#9aa7a3; --line:#33403c; --soft:#26302d;
  --cold:#6aa8e6; --warm:#e6b34a; --hot:#ff8a78; --on:#10161a; --accent:#4fc3ad; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 96px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1{font-family:var(--display);font-weight:600;font-size:1.9rem;line-height:1.15;margin:0}
.lead{margin:8px 0 0;color:var(--muted)}
.status{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.ronda{font-family:var(--display);font-size:1.3rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-family:var(--display);font-weight:600;font-size:1.45rem;line-height:1.2;margin:0;text-wrap:balance}
.card .sub{margin:-8px 0 0;color:var(--muted);font-style:italic}
.card p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.k{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:-8px}
blockquote{margin:0;padding:12px 14px;background:var(--soft);border-radius:8px;white-space:pre-wrap;font-size:.97rem}
.stars{display:flex;gap:4px}
.star{border:none;padding:2px 6px;font-size:2rem;line-height:1;color:var(--line);font-weight:400}
.star.on{color:var(--warm)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 8px;font-weight:600}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.frio[aria-pressed="true"]{background:var(--cold);color:var(--on);border-color:transparent}
button.templado[aria-pressed="true"]{background:var(--warm);color:var(--on);border-color:transparent}
button.caliente[aria-pressed="true"]{background:var(--hot);color:var(--on);border-color:transparent}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:12px}
.saved{font-size:.8rem;color:var(--muted);min-height:1.2em}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:18px}
</style>

<div class="wrap">
  <header>
    <h1>Mesa de ideas</h1>
    <p class="lead">Aquí abajo hay unas pocas propuestas ya escritas. Léelas, ponle <b>estrellas</b> a cada una y <b>escribe</b> debajo lo que te gusta, lo que no y lo que cambiarías. Con eso te traigo otra tanda más afinada.</p>
    <p class="status" id="status">Cargando…</p>
  </header>
  <main id="main" style="display:flex;flex-direction:column;gap:22px"><div class="empty">Las propuestas aparecerán aquí enseguida.</div></main>
</div>

<script>
(async function(){
  const $ = s => document.querySelector(s), main = $("#main"), status = $("#status");
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  let db = null;
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { status.textContent = "No se puede guardar desde esta vista. Abre la página con tu sesión de Claude iniciada."; return; }
  let props = [], reac = {}; const timers = {}, dirty = {};
  const loading = setTimeout(() => { status.textContent = "Tarda más de lo normal. Recarga la página si no aparece nada."; }, 10000);

  function save(id, patch, savedEl){
    reac[id] = Object.assign({}, reac[id] || {}, patch, { actualizado: new Date().toISOString() });
    dirty[id] = true; clearTimeout(timers[id]); if (savedEl) savedEl.textContent = "Guardando…";
    timers[id] = setTimeout(async () => {
      try { await db.doc("reacciones/" + id).set(reac[id]); if (savedEl) savedEl.textContent = "Guardado"; }
      catch (e) { if (savedEl) savedEl.textContent = "No se pudo guardar: " + (e && e.message || "error"); }
      dirty[id] = false;
    }, 600);
  }

  function card(p){
    const r = reac[p.id] || {}, c = el("article", "card");
    c.append(el("h2", null, p.titulo || ""));
    if (p.subtitulo) c.append(el("p", "sub", p.subtitulo));
    (p.bloques || []).forEach(b => { if (b.k) c.append(el("div", "k", b.k)); c.append(el(b.cita ? "blockquote" : "p", null, b.t || "")); });
    const saved = el("div", "saved"), t = el("div", "stars"); t.setAttribute("role", "group"); t.setAttribute("aria-label", "Puntuación de 1 a 5");
    const pinta = v => t.querySelectorAll("button").forEach((s, i) => s.classList.toggle("on", i < v));
    for (let i = 1; i <= 5; i++) { const s = el("button", "star", "★"); s.type = "button"; s.setAttribute("aria-label", i + " de 5");
      s.onclick = () => { const cur = (reac[p.id] || {}).estrellas || 0, nv = cur === i ? 0 : i; save(p.id, { estrellas: nv }, saved); pinta(nv); }; t.append(s); }
    pinta(r.estrellas || 0);
    const ta = el("textarea"); ta.id = "c-" + p.id; ta.value = r.comentario || ""; ta.placeholder = "Qué te gusta de esta, qué no, qué le cambiarías…";
    ta.setAttribute("aria-label", "Comentario sobre: " + (p.titulo || "")); ta.oninput = () => save(p.id, { comentario: ta.value }, saved);
    c.append(t, ta, saved); return c;
  }

  function pintar(){
    const a = document.activeElement; if (a && a.tagName === "TEXTAREA" && a.value) return;
    main.textContent = "";
    if (!props.length) { main.append(el("div", "empty", "Todavía no hay propuestas. Claude las añadirá enseguida.")); return; }
    const ronda = Math.max(...props.map(p => p.ronda || 1));
    const lista = props.filter(p => (p.ronda || 1) === ronda).sort((x, y) => (x.orden || 0) - (y.orden || 0));
    main.append(el("h2", "ronda", "Tanda " + ronda + (lista[0].ronda_titulo ? " · " + lista[0].ronda_titulo : "")));
    lista.forEach(p => main.append(card(p)));
    const gid = "general-" + ronda, g = reac[gid] || {}, box = el("article", "card"), sv = el("div", "saved");
    box.append(el("h2", null, "Dime lo que quieras"));
    box.append(el("p", null, "Lo que echas en falta, un ejemplo que te guste, cómo lo ves tú. Sin orden, como te salga."));
    const ta = el("textarea"); ta.id = "c-" + gid; ta.style.minHeight = "140px"; ta.value = g.comentario || ""; ta.setAttribute("aria-label", "Comentario general");
    ta.oninput = () => save(gid, { comentario: ta.value }, sv); box.append(ta, sv); main.append(box);
    status.textContent = "Se guarda solo. Cuando acabes, dile «ya» a Claude en el chat.";
  }

  db.collection("reacciones").onSnapshot(s => { s.docs.forEach(d => { if (!dirty[d.id]) reac[d.id] = d.data() || {}; }); pintar(); }, () => {});
  db.collection("propuestas").onSnapshot(s => { clearTimeout(loading); props = s.docs.map(d => Object.assign({ id: d.id }, d.data())); pintar(); },
    e => { clearTimeout(loading); status.textContent = "No se pudieron cargar las propuestas: " + (e && e.message || "error"); });
})();
</script>
